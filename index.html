<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HASH TECHIE - Loading</title>
  <link rel="stylesheet" href="splash.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
  <main class="splash">

    <!-- Latar belakang: grid + simbol kode melayang -->
    <div class="grid"></div>
    <div class="floaters" id="floaters"></div>

    <!-- Logo -->
    <div class="logo">
      <div class="ring"></div>
      <div class="ring ring--2"></div>
      <i class="bx bx-chip logo-icon"></i>
      <i class="bx bx-cog gear gear--1"></i>
      <i class="bx bx-cog gear gear--2"></i>
    </div>

    <h1 class="title">HASH <span>TECHIE</span></h1>
    <p class="tagline"><span id="typing"></span><span class="cursor">|</span></p>

    <!-- Terminal -->
    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot--red"></span>
        <span class="dot dot--yellow"></span>
        <span class="dot dot--green"></span>
        <span class="terminal-title">terminal</span>
      </div>
      <div class="terminal-body" id="terminal"></div>
    </div>

    <!-- Progress -->
    <div class="progress">
      <div class="progress-bar" id="bar"></div>
    </div>
    <p class="percent"><span id="percent">0</span>%</p>

    <a href="login.html" class="start-btn" id="startBtn">Mulai <i class="bx bx-right-arrow-alt"></i></a>
  </main>

  <script src="splash.js"></script>
</body>
</html>
